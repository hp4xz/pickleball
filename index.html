<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuesday Pickleball Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">
        <div class="signup-card">
            <h1>Tuesday Pickleball</h1>
            <p class="subtitle">Tuesday at 6:00 PM</p>

            <div id="status"></div>

            <form id="signup-form">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="tel" id="phone" placeholder="Phone Number (optional)">
                <button type="submit">Sign Me Up</button>
            </form>
        </div>

        <div class="list-card">
            <h2>Confirmed Players</h2>
            <p id="spots-left"></p>
            <ol id="confirmed-list"></ol>

            <h2>Waitlist</h2>
            <ol id="waitlist-list"></ol>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
