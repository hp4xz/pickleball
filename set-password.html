<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Admin Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">
        <div class="signup-card">
            <h1>Set Admin Password</h1>

            <p>
                Enter the password you want to use for the admin page.
            </p>

            <input
                type="password"
                id="new-password"
                placeholder="New Password"
            >

            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm Password"
            >

            <button id="set-password-button">
                Set Password
            </button>

            <div id="status"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="set-password.js"></script>

</body>
</html>
